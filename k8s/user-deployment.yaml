# ─────────────────────────────────────────────────────────────────────────────
# User Service — Deployment
# Image: docker.io/sagar9800/user-service:<tag>
# Port : 3001
# Health/Readiness probes: GET /health  (returns 200 when DB connected, 503 otherwise)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: lab8
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: campusconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: campusconnect
    spec:
      containers:
        - name: user-service
          image: sagar9800/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            # Non-sensitive: port from ConfigMap
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: USER_SERVICE_PORT
            # Sensitive: MongoDB Atlas URI from Secret
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: USER_MONGODB_URI
          # ── Liveness Probe ────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Readiness Probe ───────────────────────────────────────────────
          # The /health endpoint returns 503 while MongoDB is not connected,
          # so the Pod won't accept traffic until the DB is ready.
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
