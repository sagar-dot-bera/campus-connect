# ─────────────────────────────────────────────────────────────────────────────
# API Gateway — Service
# Type     : NodePort  (suitable for kind / local Kubernetes)
# NodePort : 30080     (access via http://<Node-IP>:30080)
# The gateway is the ONLY service exposed outside the cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lab8
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: campusconnect
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080          # ClusterIP port
      targetPort: 8080    # Container port
      nodePort: 30080     # External port on the node
