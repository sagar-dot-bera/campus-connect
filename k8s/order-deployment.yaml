# ─────────────────────────────────────────────────────────────────────────────
# Order Service — Deployment
# Image: docker.io/sagar9800/order-service:<tag>
# Port : 3003
# Health/Readiness probes: GET /health
# Also needs User+Product service URLs to validate references at request time.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: lab8
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: campusconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: campusconnect
    spec:
      containers:
        - name: order-service
          image: sagar9800/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: ORDER_SERVICE_PORT
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: ORDER_MONGODB_URI
            # Order Service calls User+Product at request-time for validation
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: USER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: PRODUCT_SERVICE_URL
            - name: DEPENDENCY_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: campusconnect-config
                  key: DEPENDENCY_TIMEOUT_MS
          # ── Liveness Probe ────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Readiness Probe ───────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
