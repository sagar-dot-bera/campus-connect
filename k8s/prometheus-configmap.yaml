# ─────────────────────────────────────────────────────────────────────────────
# Prometheus ConfigMap
# Scrapes the API Gateway /metrics and kube-state-metrics for infrastructure.
# Deployed into the lab8 namespace alongside the application.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: campusconnect
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    scrape_configs:
      # ── API Gateway ──────────────────────────────────────────────────────
      - job_name: "api-gateway"
        static_configs:
          - targets: ["api-gateway:8080"]
        metrics_path: /metrics

      # ── User Service ─────────────────────────────────────────────────────
      - job_name: "user-service"
        static_configs:
          - targets: ["user-service:3001"]
        metrics_path: /metrics

      # ── Product Service ──────────────────────────────────────────────────
      - job_name: "product-service"
        static_configs:
          - targets: ["product-service:3002"]
        metrics_path: /metrics

      # ── Order Service ────────────────────────────────────────────────────
      - job_name: "order-service"
        static_configs:
          - targets: ["order-service:3003"]
        metrics_path: /metrics

      # ── Prometheus self-monitoring ───────────────────────────────────────
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
