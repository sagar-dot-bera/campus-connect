apiVersion: v1
kind: ConfigMap
metadata:
  name: campusconnect-config
  namespace: lab8
  labels:
    app.kubernetes.io/name: campusconnect
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: campusconnect
data:
  # ─── Service ports ───────────────────────────────────────────────
  GATEWAY_PORT: "8080"
  USER_SERVICE_PORT: "3001"
  PRODUCT_SERVICE_PORT: "3002"
  ORDER_SERVICE_PORT: "3003"

  # ─── Internal Service URLs (Kubernetes DNS names) ─────────────────
  # Use stable Kubernetes Service names — never Pod IPs.
  USER_SERVICE_URL: "http://user-service:3001"
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  ORDER_SERVICE_URL: "http://order-service:3003"

  # ─── Timeout configuration ────────────────────────────────────────
  GATEWAY_PROXY_TIMEOUT_MS: "10000"
  DEPENDENCY_TIMEOUT_MS: "3000"
