
name: CI/CD — CampusConnect Microservices

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: sagar9800

jobs:

  # JOB 1: Build and test all microservices
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script found. Skipping tests."
          fi

  # JOB 2: Build and push Docker images
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker credentials
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USER" || (echo "Missing Docker username" && exit 1)
          test -n "$DOCKER_TOKEN" || (echo "Missing Docker token" && exit 1)
          echo "Docker credentials are available."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 3: Deploy to local Kind cluster
  # Requires a self-hosted runner on the machine running Kind.
  k8s-deploy:
    name: Kubernetes Rollout
    runs-on: self-hosted
    needs: docker-build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Ensure namespace exists
        run: |
          kubectl create namespace lab8 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure MongoDB Secret exists
        env:
          USER_URI: ${{ secrets.USER_MONGODB_URI }}
          PRODUCT_URI: ${{ secrets.PRODUCT_MONGODB_URI }}
          ORDER_URI: ${{ secrets.ORDER_MONGODB_URI }}
        run: |
          kubectl create secret generic mongodb-secret \
            --from-literal=USER_MONGODB_URI="$USER_URI" \
            --from-literal=PRODUCT_MONGODB_URI="$PRODUCT_URI" \
            --from-literal=ORDER_MONGODB_URI="$ORDER_URI" \
            --namespace lab8 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml -n lab8
          kubectl apply -f k8s/gateway-deployment.yaml -n lab8
          kubectl apply -f k8s/gateway-service.yaml -n lab8
          kubectl apply -f k8s/user-deployment.yaml -n lab8
          kubectl apply -f k8s/user-service.yaml -n lab8
          kubectl apply -f k8s/product-deployment.yaml -n lab8
          kubectl apply -f k8s/product-service.yaml -n lab8
          kubectl apply -f k8s/order-deployment.yaml -n lab8
          kubectl apply -f k8s/order-service.yaml -n lab8

      - name: Update deployment images
        run: |
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/api-gateway:${{ env.IMAGE_TAG }} -n lab8

          kubectl set image deployment/user-service \
            user-service=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/user-service:${{ env.IMAGE_TAG }} -n lab8

          kubectl set image deployment/product-service \
            product-service=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/product-service:${{ env.IMAGE_TAG }} -n lab8

          kubectl set image deployment/order-service \
            order-service=${{ env.REGISTRY }}/${{ env.DOCKERHUB_USERNAME }}/order-service:${{ env.IMAGE_TAG }} -n lab8

      - name: Verify rollouts
        run: |
          kubectl rollout status deployment/api-gateway -n lab8 --timeout=180s
          kubectl rollout status deployment/user-service -n lab8 --timeout=180s
          kubectl rollout status deployment/product-service -n lab8 --timeout=180s
          kubectl rollout status deployment/order-service -n lab8 --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get pods -n lab8
          kubectl get deployments -n lab8
          kubectl get services -n lab8
